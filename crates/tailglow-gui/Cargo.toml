[package]
name = "tailglow-gui"
description = "Tailglow desktop app (iced): open-source settings for Keychron mice"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tailglow-gui"
path = "src/main.rs"

[dependencies]
tailglow-core.workspace = true
tailglow-hid.workspace = true
iced = { workspace = true, features = ["tiny-skia", "canvas", "tokio", "linux-theme-detection", "x11", "wayland", "fira-sans"] }
image.workspace = true
# Native file dialogs through xdg-desktop-portal (pure Rust: no GTK -dev packages).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
toml.workspace = true

# The desktop's light/dark preference (xdg-desktop-portal), with the same
# features iced itself enables, so no new crates are pulled in.
[target.'cfg(target_os = "linux")'.dependencies]
mundy = { version = "0.2", default-features = false, features = ["async-io", "color-scheme"] }

[dev-dependencies]
assert_cmd.workspace = true
