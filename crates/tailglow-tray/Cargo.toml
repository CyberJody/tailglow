[package]
name = "tailglow-tray"
description = "Tailglow tray icon: battery, connection (USB/Bluetooth), quick lighting/DPI menu, low-battery alerts, per-application profiles (X11)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tailglow-tray"
path = "src/main.rs"

[dependencies]
tailglow-core.workspace = true
tailglow-hid.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
# StatusNotifierItem over D-Bus, pure Rust (zbus). Cinnamon's xapp status
# applet, KDE and most Wayland bars implement the host side.
ksni = { version = "0.3", features = ["blocking"] }
zbus.workspace = true
# Active-window tracking on X11, pure Rust (no libX11).
x11rb = "0.13"
